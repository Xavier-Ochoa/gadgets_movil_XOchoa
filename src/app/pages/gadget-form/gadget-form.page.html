<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/gadgets"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ id ? 'Editar Gadget' : 'Nuevo Gadget' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Preview imagen -->
  <div style="display:flex; justify-content:center; margin-bottom: 16px;">
    <div style="width:120px; height:120px; border-radius:12px; overflow:hidden;
      background:#f0f0f0; display:flex; align-items:center; justify-content:center;
      font-size:48px; border: 2px solid #ddd;">
      <img *ngIf="gadget.imagen_url" [src]="gadget.imagen_url"
        style="width:100%; height:100%; object-fit:cover;" />
      <span *ngIf="!gadget.imagen_url">📱</span>
    </div>
  </div>

  <!-- Subida de imagen desde Storage -->
  <div style="display:flex; justify-content:center; margin-bottom: 20px;">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;
      background: var(--ion-color-primary); color: white;
      padding: 8px 16px; border-radius: 8px; font-size: 14px;">
      <ion-icon name="image-outline"></ion-icon>
      {{ subiendoImagen ? 'Subiendo...' : 'Subir foto desde dispositivo' }}
      <input type="file" accept="image/*" style="display:none"
        (change)="seleccionarImagen($event)" [disabled]="subiendoImagen" />
    </label>
    <ion-spinner *ngIf="subiendoImagen" name="crescent" style="margin-left: 8px;"></ion-spinner>
  </div>

  <!-- Campos del formulario -->
  <ion-item>
    <ion-label position="stacked">Nombre del Gadget *</ion-label>
    <ion-input [(ngModel)]="gadget.nombre" placeholder="Ej: AirPods Pro"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Marca *</ion-label>
    <ion-input [(ngModel)]="gadget.marca" placeholder="Ej: Apple"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Precio ($)</ion-label>
    <ion-input type="number" [(ngModel)]="gadget.precio"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Stock</ion-label>
    <ion-input type="number" [(ngModel)]="gadget.stock"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Categoría</ion-label>
    <ion-input [(ngModel)]="gadget.categoria" placeholder="Ej: Audio, Wearable, Smart Home"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">Descripción</ion-label>
    <ion-textarea [(ngModel)]="gadget.descripcion" rows="3"
      placeholder="Describe el gadget..."></ion-textarea>
  </ion-item>

  <!-- URL de video YouTube/TikTok -->
  <ion-item>
    <ion-label position="stacked">🎬 URL Video (YouTube o TikTok)</ion-label>
    <ion-input
      [(ngModel)]="gadget.video_url"
      placeholder="https://www.youtube.com/watch?v=..."
      type="url">
    </ion-input>
  </ion-item>

  <!-- Audio: subida desde Storage O URL manual -->
  <ion-item>
    <ion-label position="stacked">🔊 URL de Audio (Supabase Storage)</ion-label>
    <ion-input [(ngModel)]="gadget.audio_url" placeholder="Se llenará al subir archivo" type="url"></ion-input>
  </ion-item>

  <div style="display:flex; justify-content:center; margin: 8px 0 20px;">
    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;
      background: var(--ion-color-warning); color: white;
      padding: 8px 16px; border-radius: 8px; font-size: 14px;">
      <ion-icon name="musical-note-outline"></ion-icon>
      {{ subiendoAudio ? 'Subiendo...' : 'Subir audio desde dispositivo' }}
      <input type="file" accept="audio/*" style="display:none"
        (change)="seleccionarAudio($event)" [disabled]="subiendoAudio" />
    </label>
    <ion-spinner *ngIf="subiendoAudio" name="crescent" style="margin-left:8px;"></ion-spinner>
  </div>

  <ion-button expand="block" class="ion-margin-top" (click)="guardar()" [disabled]="cargando">
    <ion-spinner *ngIf="cargando" name="crescent" slot="start"></ion-spinner>
    {{ cargando ? 'Guardando...' : 'Guardar Gadget' }}
  </ion-button>

</ion-content>
